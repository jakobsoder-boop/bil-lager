<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7">
<title>Bil-lager v7</title>
<style>
:root{--blue:#0a84ff;--bg:#f5f5f7;--card:#fff;--text:#111;--muted:#777;--line:#e7e7eb;--danger:#ff3b30}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{border:0}.app{max-width:900px;margin:auto;padding:26px 18px 110px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 4px 20px}.title{font-size:48px;font-weight:800;letter-spacing:-2.5px;margin:0}.stats{font-size:20px;color:#777;margin-top:4px}.settings{width:58px;height:58px;border-radius:20px;background:#fff;color:var(--blue);font-size:29px;box-shadow:0 5px 18px #00000008}.search{display:flex;align-items:center;background:#fff;border-radius:25px;padding:0 20px;height:72px;box-shadow:0 4px 16px #00000008;margin-bottom:24px}.search span{color:#8a8a8e;font-size:25px;margin-right:14px}.search input{border:0;outline:0;width:100%;font-size:22px;background:transparent}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.cat{background:#fff;border-radius:28px;padding:28px 26px;min-height:178px;text-align:left;box-shadow:0 5px 18px #00000008}.cat .ico{font-size:42px;color:var(--blue);height:54px}.cat h2{color:var(--blue);font-size:27px;margin:10px 0 4px;letter-spacing:-.7px}.cat p{color:#777;font-size:18px;margin:0}.back{color:var(--blue);font-size:22px;background:transparent;padding:0 0 24px}.catTitle{display:flex;align-items:center;gap:14px;font-size:42px;letter-spacing:-1.5px;margin:0 0 22px}.catTitle .ico{color:#111;font-size:39px}.list{display:flex;flex-direction:column;gap:14px}.product{background:#fff;border-radius:25px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;box-shadow:0 4px 15px #00000007}.pname{font-size:24px;font-weight:750;line-height:1.18}.qtyLabel{font-size:17px;color:#888;margin-top:7px}.controls{display:flex;align-items:center;gap:10px}.circle{width:62px;height:62px;border-radius:50%;background:#f0f0f4;color:var(--blue);font-size:36px;display:grid;place-items:center}.qty{min-width:52px;text-align:center;font-size:25px;font-weight:600;background:transparent}.qty.tap{cursor:pointer}.more{width:62px;height:62px;border-radius:50%;background:#f0f0f4;color:var(--blue);font-size:25px}.add{margin-top:18px;background:#fff;color:var(--blue);font-size:20px;border-radius:20px;padding:15px 22px}.fab{position:fixed;right:22px;bottom:25px;width:72px;height:72px;border-radius:25px;background:#111;color:#fff;font-size:42px;box-shadow:0 12px 28px #0003}.empty{padding:40px 10px;color:#777;font-size:19px;text-align:center}.modalBack{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:20}.modalBack.show{display:flex}.sheet{width:min(680px,100%);background:#fff;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet h3{font-size:28px;margin:0 0 18px}.field{margin:12px 0}.field label{display:block;color:#666;font-size:14px;margin:0 0 6px}.field input,.field select{width:100%;height:52px;border:1px solid #ddd;border-radius:14px;padding:0 14px;font-size:18px}.row{display:flex;gap:10px}.row>*{flex:1}.primary{background:var(--blue);color:#fff;border-radius:15px;padding:14px;font-size:18px;width:100%;margin-top:10px}.secondary{background:#eee;color:#111;border-radius:15px;padding:14px;font-size:18px;width:100%;margin-top:10px}.danger{background:#ffe9e7;color:var(--danger);border-radius:15px;padding:14px;font-size:18px;width:100%;margin-top:10px}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tool{background:#f2f2f7;border-radius:17px;padding:15px;font-size:17px}.catRow{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.catName{font-size:19px}.mini{color:var(--blue);background:transparent;font-size:22px;padding:8px}.toast{position:fixed;left:50%;bottom:105px;transform:translateX(-50%);background:#111;color:#fff;padding:11px 16px;border-radius:14px;z-index:50;display:none}.toast.show{display:block}@media(max-width:650px){.grid{gap:12px}.cat{padding:23px 20px;min-height:160px}.cat h2{font-size:22px}.title{font-size:45px}.product{padding:18px}.pname{font-size:21px}.circle,.more{width:58px;height:58px}.qty{min-width:42px}.catTitle{font-size:38px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1 class="title">Bil-lager</h1><div class="stats" id="stats"></div></div><button class="settings" onclick="openSettings()">⚙️</button></div>
  <div class="search"><span>⌕</span><input id="search" placeholder="Sök produkt..." autocomplete="off"></div>
  <main id="view"></main>
</div>
<button class="fab" onclick="openProduct()">＋</button>
<div class="toast" id="toast"></div>

<div class="modalBack" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY_P='bilLagerProducts', KEY_C='bilLagerCategories', KEY_M='bilLagerMigratedV5', KEY_SEED='bilLagerSeedV6';
const seedCats=[
['Rörelsedetektorer','◉'],['Magnetkontakter','▣'],['Rökdetektorer','◌'],['Sirener','◇'],['Centralapparater','▤'],['Expansionskort','▦'],['Batterier','▰'],['Motstånd','≈'],['Kabel','≋'],['Övrigt','＋'],['Glaskross','✧'],['Överfallsknappar','＋'],['Manöverpanel','▤']
];
const seed=[
['Rörelsedetektorer','DD1012-N',1],['Rörelsedetektorer','DD1016-AM',1],['Rörelsedetektorer','IR8M Trådlös 8100',1],['Rörelsedetektorer','TX2413-03-01 Trådlös SDPRO',1],['Rörelsedetektorer','VE735 Långstrålande',1],['Rörelsedetektorer','Paradox Husdjursanpassad',1],['Rörelsedetektorer','DI601 Utomhusdetektor',1],
['Magnetkontakter','MC440',8],['Magnetkontakter','TX1011-03-01 Trådlös SDPRO',1],['Magnetkontakter','DO8M Trådlös 8100',1],
['Rökdetektorer','DP721RTA',1],['Rökdetektorer','TX 6010-03-01 Trådlös SDPRO',1],['Rökdetektorer','DP713-7R Värmedetektor',1],
['Sirener','AS210N-L',1],['Centralapparater','SDPRO',1],['Centralapparater','ATS1201 Undercentral',1],
['Expansionskort','ATS1810 Reläkort',1],['Expansionskort','ATS1202LE Sektionskort',1],['Expansionskort','ATS1202 Sektionskort',1],['Expansionskort','ATS 608 Sektionskort',1],['Expansionskort','ATS 606',1],
['Batterier','12V 7.2Ah',3],['Batterier','12V 18aH',1],['Batterier','CR2032',1],['Batterier','CR2045',1],['Batterier','CR123A',1],['Batterier','AA',1],
['Motstånd','4,7 kΩ',36],['Övrigt','4G Modul',1],['Övrigt','Eth Modul',1],['Övrigt','Strömkabel',1],['Glaskross','GS960',1],
['Överfallsknappar','HB105-V',1],['Överfallsknappar','HB105-M',1],['Överfallsknappar','TX 3011-03-01 Trådlös SDPRO',1],['Överfallsknappar','TCPA2B Trådlös 8100',1],
['Manöverpanel','SDPRO',1],['Manöverpanel','8100',1],['Manöverpanel','896',1]
];
let products=[], cats=[];
function load(){try{products=JSON.parse(localStorage.getItem(KEY_P)||'[]');cats=JSON.parse(localStorage.getItem(KEY_C)||'[]')}catch(e){products=[];cats=[]}
  // Normalize data from older versions so category cards never become "undefined".
  if(!Array.isArray(products)) products=[];
  if(!Array.isArray(cats)) cats=[];
  cats=cats.map(c=>{
    if(typeof c==='string') return {id:id(),name:c,icon:'＋'};
    if(!c||typeof c!=='object') return null;
    const name=(c.name??c.category??c.title??'').toString().trim();
    if(!name || name==='undefined' || name==='null') return null;
    return {id:c.id||id(),name,icon:c.icon||'＋'};
  }).filter(Boolean);
  // Remove duplicate category names while keeping the first one.
  const seenCats=new Set(); cats=cats.filter(c=>{const k=c.name.toLowerCase();if(seenCats.has(k))return false;seenCats.add(k);return true});
  products=products.map(p=>({id:p.id||id(),name:(p.name??'').toString(),category:(typeof p.category==='string'?p.category:(p.category?.name||p.category?.title||'')).toString(),qty:Math.max(0,parseInt(p.qty??0,10)||0)})).filter(p=>p.name);
  if(localStorage.getItem(KEY_SEED)!=='1'){
    seedCats.forEach(([name,icon])=>{if(!cats.some(c=>c.name.toLowerCase()===name.toLowerCase()))cats.push({id:id(),name,icon})});
    seed.forEach(([category,name,qty])=>{let p=products.find(x=>x.name.toLowerCase()===name.toLowerCase()&&x.category===category);if(!p)products.push({id:id(),name,category,qty})});
    localStorage.setItem(KEY_SEED,'1'); localStorage.setItem(KEY_M,'1');
  }
  save();
}
function id(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function save(){localStorage.setItem(KEY_P,JSON.stringify(products));localStorage.setItem(KEY_C,JSON.stringify(cats))}
function esc(s){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function totals(){return {p:products.length,q:products.reduce((a,p)=>a+(+p.qty||0),0)}}
function render(){const s=document.getElementById('search').value.trim().toLowerCase();const t=totals();document.getElementById('stats').textContent=`${t.p} produkter · ${t.q} st totalt`;if(s){renderSearch(s);return}renderCats()}
function renderCats(){const v=document.getElementById('view');v.innerHTML='<div class="grid">'+cats.map((c,i)=>{const ps=products.filter(p=>p.category===c.name),q=ps.reduce((a,p)=>a+(+p.qty||0),0);return `<button type="button" class="cat" data-cat-index="${i}" data-cat-name="${esc(c.name)}"><div class="ico">${esc(c.icon||'＋')}</div><h2>${esc(c.name)}</h2><p>${ps.length} produkter · ${q} st</p></button>`}).join('')+'</div>'}
function renderSearch(s){const list=products.filter(p=>(p.name+' '+p.category).toLowerCase().includes(s));const v=document.getElementById('view');v.innerHTML=list.length?'<div class="list">'+list.map(productHtml).join('')+'</div>':'<div class="empty">Ingen produkter hittades.</div>'}
function openCat(name){document.getElementById('search').value='';const c=cats.find(x=>x.name===name);const ps=products.filter(p=>p.category===name);document.getElementById('view').innerHTML=`<button class="back" onclick="render()">‹ Alla kategorier</button><h2 class="catTitle"><span class="ico">${esc(c?.icon||'＋')}</span>${esc(name)}</h2><div class="list">${ps.map(productHtml).join('')}</div><button class="add" onclick="openProduct(${JSON.stringify(name)})">＋ Lägg till produkt</button>`}
function productHtml(p){return `<div class="product"><div><div class="pname">${esc(p.name)}</div><div class="qtyLabel">${p.qty} st</div></div><div class="controls"><button class="circle" onclick="changeQty('${p.id}',-1)">−</button><button class="qty" onclick="editQty('${p.id}')">${p.qty}</button><button class="circle" onclick="changeQty('${p.id}',1)">＋</button><button class="more" onclick="editProduct('${p.id}')">···</button></div></div>`}
function changeQty(pid,d){const p=products.find(x=>x.id===pid);if(!p)return;p.qty=Math.max(0,(+p.qty||0)+d);save();refreshCurrent()}
function editQty(pid){const p=products.find(x=>x.id===pid);if(!p)return;openSheet(`<h3>Ändra antal</h3><div class="field"><label>${esc(p.name)}</label><input id="qtyInput" type="number" min="0" value="${p.qty}"></div><button class="primary" onclick="setQty('${p.id}')">Spara</button><button class="secondary" onclick="closeModal()">Avbryt</button>`);setTimeout(()=>document.getElementById('qtyInput').focus(),80)}
function setQty(pid){const p=products.find(x=>x.id===pid);const n=Math.max(0,parseInt(document.getElementById('qtyInput').value||0,10));p.qty=n;save();closeModal();refreshCurrent();toast('Antal uppdaterat')}
function openProduct(cat=''){openSheet(`<h3>Ny produkt</h3><div class="field"><label>Produkt</label><input id="pn" placeholder="T.ex. MC440"></div><div class="field"><label>Kategori</label><select id="pc">${cats.map(c=>`<option ${c.name===cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Antal</label><input id="pq" type="number" min="0" value="1"></div><button class="primary" onclick="addProduct()">Spara</button><button class="secondary" onclick="closeModal()">Avbryt</button>`)}
function addProduct(){const name=document.getElementById('pn').value.trim();const category=document.getElementById('pc').value;const qty=Math.max(0,parseInt(document.getElementById('pq').value||0,10));if(!name)return toast('Skriv ett produktnamn');const existing=products.find(p=>p.name.toLowerCase()===name.toLowerCase()&&p.category===category);if(existing)existing.qty+=qty;else products.push({id:id(),name,category,qty});save();closeModal();render();toast('Produkt sparad')}
function editProduct(pid){const p=products.find(x=>x.id===pid);openSheet(`<h3>Redigera produkt</h3><div class="field"><label>Produkt</label><input id="en" value="${esc(p.name)}"></div><div class="field"><label>Kategori</label><select id="ec">${cats.map(c=>`<option ${c.name===p.category?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Antal</label><input id="eq" type="number" min="0" value="${p.qty}"></div><button class="primary" onclick="saveEdit('${p.id}')">Spara</button><button class="danger" onclick="deleteProduct('${p.id}')">Ta bort produkt</button><button class="secondary" onclick="closeModal()">Avbryt</button>`)}
function saveEdit(pid){const p=products.find(x=>x.id===pid);p.name=document.getElementById('en').value.trim()||p.name;p.category=document.getElementById('ec').value;p.qty=Math.max(0,parseInt(document.getElementById('eq').value||0,10));save();closeModal();render();toast('Produkt uppdaterad')}
function deleteProduct(pid){if(!confirm('Ta bort produkten?'))return;products=products.filter(p=>p.id!==pid);save();closeModal();render();toast('Produkt borttagen')}
function openSettings(){openSheet(`<h3>Inställningar</h3><div class="toolgrid"><button class="tool" onclick="exportData()">💾 Exportera lager</button><button class="tool" onclick="document.getElementById('file').click()">📥 Importera lager</button><button class="tool" onclick="manageCats()">⚙️ Hantera kategorier</button><button class="tool" onclick="voiceHelp()">🎤 Röststyrning</button></div><input id="file" type="file" accept="application/json" style="display:none" onchange="importData(event)"><button class="secondary" onclick="closeModal()">Stäng</button>`)}
function manageCats(){openSheet(`<h3>Kategorier</h3><div>${cats.map(c=>`<div class="catRow"><span class="catName">${esc(c.icon||'＋')} ${esc(c.name)}</span><span><button class="mini" onclick="renameCat('${c.id}')">✏️</button><button class="mini" onclick="deleteCat('${c.id}')">🗑️</button></span></div>`).join('')}</div><button class="primary" onclick="newCat()">＋ Ny kategori</button><button class="secondary" onclick="openSettings()">Tillbaka</button>`)}
function newCat(){openSheet(`<h3>Ny kategori</h3><div class="field"><label>Namn</label><input id="cn" placeholder="T.ex. Glaskross"></div><div class="field"><label>Ikon</label><input id="ci" value="＋" maxlength="2"></div><button class="primary" onclick="createCat()">Skapa</button><button class="secondary" onclick="manageCats()">Avbryt</button>`)}
function createCat(){const name=document.getElementById('cn').value.trim();if(!name)return toast('Skriv ett namn');if(cats.some(c=>c.name.toLowerCase()===name.toLowerCase()))return toast('Kategorin finns redan');cats.push({id:id(),name,icon:document.getElementById('ci').value||'＋'});save();manageCats();toast('Kategori skapad')}
function renameCat(cid){const c=cats.find(x=>x.id===cid);openSheet(`<h3>Byt namn</h3><div class="field"><label>Kategori</label><input id="rn" value="${esc(c.name)}"></div><button class="primary" onclick="saveCatName('${cid}')">Spara</button><button class="secondary" onclick="manageCats()">Avbryt</button>`)}
function saveCatName(cid){const c=cats.find(x=>x.id===cid);const old=c.name,n=document.getElementById('rn').value.trim();if(!n)return;c.name=n;products.forEach(p=>{if(p.category===old)p.category=n});save();manageCats();toast('Kategori ändrad')}
function deleteCat(cid){const c=cats.find(x=>x.id===cid);if(c.name==='Övrigt')return toast('Övrigt kan inte tas bort');const affected=products.filter(p=>p.category===c.name);if(affected.length&&!confirm(`Flytta ${affected.length} produkter till Övrigt och ta bort kategorin?`))return;affected.forEach(p=>p.category='Övrigt');cats=cats.filter(x=>x.id!==cid);save();manageCats();toast('Kategori borttagen')}
function exportData(){const data={version:5,exportedAt:new Date().toISOString(),categories:cats,products};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='bil-lager-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup skapad')}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.products)||!Array.isArray(d.categories))throw 0;products=d.products;cats=d.categories;save();closeModal();render();toast('Lager återställt')}catch{toast('Filen kunde inte läsas')}};r.readAsText(f)}
function voiceHelp(){openSheet(`<h3>🎤 Röststyrning</h3><p style="font-size:18px;line-height:1.45;color:#555">Tryck på mikrofonknappen och säg till exempel:<br><br><b>"Använd 2 MC440"</b><br><b>"Lägg till 5 MC440"</b></p><button class="primary" onclick="startVoice()">🎤 Starta röststyrning</button><button class="secondary" onclick="closeModal()">Stäng</button>`)}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Röstigenkänning stöds inte i denna Safari-version');return}const r=new SR();r.lang='sv-SE';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>processVoice(e.results[0][0].transcript);r.onerror=()=>toast('Jag kunde inte höra kommandot');r.start();toast('Lyssnar…')}
function processVoice(text){const t=text.toLowerCase();let m=t.match(/(?:använd|anvant|använt|ta bort|minus|dra av)\s+(\d+)\s+(.+)/);let add=false;if(!m){m=t.match(/(?:lägg till|plus|öka)\s+(\d+)\s+(.+)/);add=true}if(!m){toast('Säg t.ex. "använd 2 MC440"');return}const n=parseInt(m[1],10);const name=m[2].replace(/\s+(stycken?|st)\.?$/,'').trim();let p=products.find(x=>x.name.toLowerCase()===name)||products.find(x=>x.name.toLowerCase().includes(name));if(!p){toast('Hittade inte '+name);return}p.qty=Math.max(0,p.qty+(add?n:-n));save();closeModal();render();toast(`${p.name}: ${p.qty} st`)}
function refreshCurrent(){const q=document.getElementById('search').value.trim().toLowerCase();if(q)renderSearch(q);else{const title=document.querySelector('.catTitle');if(title){const name=title.textContent.trim();openCat(name)}else render()}}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),1800)}
document.getElementById('view').addEventListener('click',e=>{const card=e.target.closest('.cat');if(!card)return;const i=Number(card.dataset.catIndex);const name=card.dataset.catName||cats[i]?.name;if(name)openCat(name)});document.getElementById('search').addEventListener('input',render);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});load();render();
</script>
</body></html>
