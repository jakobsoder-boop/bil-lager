<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Bil-lager</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}header{background:#111827;color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:2}h1{margin:0 0 12px;font-size:24px}.search{width:100%;padding:13px;border:0;border-radius:12px;font-size:16px}main{max-width:700px;margin:auto;padding:12px 14px 90px}.cat{font-size:18px;font-weight:700;margin:20px 0 8px}.card{background:#fff;border-radius:14px;padding:12px;margin:8px 0;box-shadow:0 1px 3px #0001}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-weight:650}.count{display:flex;align-items:center;gap:10px}.btn{width:38px;height:38px;border:0;border-radius:10px;background:#e5e7eb;font-size:22px}.num{min-width:24px;text-align:center;font-weight:700}.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border:0;border-radius:50%;background:#111827;color:white;font-size:30px;box-shadow:0 5px 18px #0004}dialog{border:0;border-radius:18px;width:min(92%,430px);padding:0}dialog::backdrop{background:#0007}.form{padding:20px}.form h2{margin-top:0}.form input{width:100%;padding:12px;margin:5px 0 12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border:0;border-radius:10px}.primary{background:#111827;color:#fff}.delete{width:100%;margin-top:8px;padding:12px;border:0;border-radius:10px;background:#fee2e2;color:#991b1b}.empty{text-align:center;color:#6b7280;padding:40px}</style></head><body><header><h1>🚗 Bil-lager</h1><input id="search" class="search" placeholder="Sök produkt, t.ex. MC440"></header><main id="app"></main><button class="fab" onclick="openAdd()">+</button><dialog id="dlg"><form class="form" onsubmit="save(event)"><h2 id="title">Lägg till produkt</h2><input type="hidden" id="id"><label>Produkt</label><input id="name" required placeholder="MC440"><label>Kategori</label><input id="category" required placeholder="Magnetkontakter"><label>Antal</label><input id="qty" type="number" min="0" value="1" required><div class="actions"><button type="button" onclick="dlg.close()">Avbryt</button><button class="primary">Spara</button></div><button type="button" id="del" class="delete" onclick="remove()">Ta bort</button></form></dialog><script>const seed=[['MC440','Magnetkontakter',8],['MC420','Magnetkontakter',5],['ISC-BPR2','Rörelsedetektorer',6],['EV425','Rörelsedetektorer',4],['12 V 7 Ah','Batterier',3],['4,7 kΩ','Motstånd',36]].map((x,i)=>({id:i+1,name:x[0],category:x[1],qty:x[2]}));let p=JSON.parse(localStorage.getItem('bilLager')||'null')||seed;const app=document.getElementById('app'),dlg=document.getElementById('dlg');function saveData(){localStorage.setItem('bilLager',JSON.stringify(p));render()}function render(){let q=search.value.toLowerCase().trim(),a=p.filter(x=>(x.name+' '+x.category).toLowerCase().includes(q));if(!a.length){app.innerHTML='<div class="empty">Inga produkter hittades.</div>';return}let g={};a.forEach(x=>(g[x.category]??=[]).push(x));app.innerHTML=Object.keys(g).sort().map(c=>`<div class="cat">${esc(c)}</div>`+g[c].sort((a,b)=>a.name.localeCompare(b.name)).map(x=>`<div class="card"><div class="row"><div class="name" onclick="edit(${x.id})">${esc(x.name)}</div><div class="count"><button class="btn" onclick="change(${x.id},-1)">−</button><span class="num">${x.qty}</span><button class="btn" onclick="change(${x.id},1)">+</button></div></div></div>`).join('')).join('')}function change(id,d){let x=p.find(x=>x.id===id);x.qty=Math.max(0,x.qty+d);saveData()}function openAdd(){title.textContent='Lägg till produkt';id.value='';name.value='';category.value='';qty.value=1;del.style.display='none';dlg.showModal()}function edit(i){let x=p.find(x=>x.id===i);title.textContent='Ändra produkt';id.value=x.id;name.value=x.name;category.value=x.category;qty.value=x.qty;del.style.display='block';dlg.showModal()}function save(e){e.preventDefault();let i=id.value;if(i){let x=p.find(x=>x.id==i);x.name=name.value.trim();x.category=category.value.trim();x.qty=+qty.value}else p.push({id:Date.now(),name:name.value.trim(),category:category.value.trim(),qty:+qty.value});dlg.close();saveData()}function remove(){let i=+id.value;if(confirm('Ta bort produkten?')){p=p.filter(x=>x.id!==i);dlg.close();saveData()}}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}search.addEventListener('input',render);render();</script></body></html>
