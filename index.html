<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Bil-lager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit} .app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom))}
header{padding:22px 2px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:34px;margin:0;font-weight:750;letter-spacing:-1.2px}.sub{color:#777;font-size:15px;margin-top:3px}.iconbtn{width:42px;height:42px;border:0;border-radius:14px;background:white;box-shadow:0 2px 12px #0000000d;font-size:23px}
.search{position:sticky;top:0;z-index:3;padding:6px 0 14px;background:#f5f5f7}.searchbox{background:#fff;border-radius:15px;padding:11px 14px;display:flex;gap:9px;align-items:center;box-shadow:0 2px 12px #0000000b}.searchbox span{color:#8e8e93}.searchbox input{border:0;outline:0;width:100%;font-size:17px;background:transparent}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cat{border:0;text-align:left;background:white;border-radius:20px;padding:17px;min-height:125px;box-shadow:0 3px 14px #0000000a;transition:.15s}.cat:active{transform:scale(.97)}.emoji{font-size:28px;margin-bottom:12px}.catname{font-weight:700;font-size:17px}.count{color:#8a8a8f;font-size:14px;margin-top:4px}
.view{display:none}.back{border:0;background:none;padding:8px 0 12px;font-size:17px;color:#007aff}.titleRow{display:flex;align-items:center;gap:10px;margin-bottom:16px}.titleIcon{font-size:30px}.view h2{font-size:28px;letter-spacing:-.8px;margin:0}.products{display:flex;flex-direction:column;gap:10px}.product{background:white;border-radius:18px;padding:14px 15px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px #0000000a}.pinfo{flex:1;min-width:0}.pname{font-size:17px;font-weight:650}.qty{font-size:14px;color:#777;margin-top:3px}.controls{display:flex;align-items:center;gap:8px}.round{width:38px;height:38px;border:0;border-radius:50%;background:#f0f0f3;font-size:24px;line-height:1}.num{min-width:30px;text-align:center;font-weight:700}.empty{color:#777;text-align:center;padding:35px 10px}.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:19px;background:#111;color:#fff;font-size:30px;box-shadow:0 8px 24px #0003}.actions{display:flex;gap:8px;margin-top:15px}.smallbtn{border:0;background:#fff;border-radius:12px;padding:10px 13px;font-size:14px}.modal{position:fixed;inset:0;background:#0005;display:none;align-items:flex-end;z-index:10}.sheet{background:#f5f5f7;width:100%;max-width:720px;margin:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -10px 35px #0002}.sheet h3{margin:0 0 15px;font-size:22px}.field{background:#fff;border-radius:13px;padding:11px 13px;margin-bottom:10px}.field label{display:block;font-size:12px;color:#777;margin-bottom:4px}.field input,.field select{border:0;outline:0;width:100%;background:transparent;font-size:17px}.modalBtns{display:flex;gap:10px;margin-top:14px}.modalBtns button{flex:1;padding:13px;border:0;border-radius:13px;font-weight:650}.cancel{background:#fff}.save{background:#111;color:white}.danger{background:#ffe9e9!important;color:#c00}.catManage{display:flex;align-items:center;gap:8px;background:#fff;border-radius:13px;padding:9px 10px;margin-bottom:8px}.catManage input{border:0;outline:0;min-width:0;flex:1;font-size:16px;background:transparent}.mini{border:0;background:#f0f0f3;border-radius:10px;width:38px;height:38px}.mini.danger{background:#ffe9e9}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}.app{padding-left:24px;padding-right:24px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bil-lager">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head><body>
<div class="app">
<header><div><h1>Bil-lager</h1><div class="sub" id="summary">0 produkter</div></div><button class="iconbtn" onclick="openCategories()">⚙︎</button></header>
<div class="search"><div class="searchbox"><span>⌕</span><input id="search" placeholder="Sök produkt..." oninput="searchProducts()"></div></div>
<section id="home" class="view" style="display:block"><div class="grid" id="categories"></div></section>
<section id="category" class="view"><button class="back" onclick="showHome()">‹ Alla kategorier</button><div class="titleRow"><div class="titleIcon" id="catIcon"></div><h2 id="catTitle"></h2></div><div class="products" id="productList"></div><div class="actions"><button class="smallbtn" onclick="openProduct()">＋ Lägg till produkt</button></div></section>
<section id="results" class="view"><div class="titleRow"><h2>Sökresultat</h2></div><div class="products" id="resultList"></div></section>
<button class="fab" onclick="openProduct()">＋</button>
</div>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h3 id="modalTitle">Ny produkt</h3><div class="field"><label>Produktnamn / modell</label><input id="pname" placeholder="t.ex. MC440"></div><div class="field"><label>Kategori</label><select id="pcat"></select></div><div class="field"><label>Antal</label><input id="pqty" type="number" min="0" value="1"></div><div class="modalBtns"><button class="cancel" onclick="closeModal()">Avbryt</button><button class="save" onclick="saveProduct()">Spara</button></div><div id="deleteWrap"></div></div></div>
<div class="modal" id="catModal" onclick="if(event.target===this)closeCatModal()"><div class="sheet"><h3>Hantera kategorier</h3><div id="catManageList"></div><div class="modalBtns"><button class="cancel" onclick="closeCatModal()">Stäng</button><button class="save" onclick="addCategory()">＋ Ny kategori</button></div></div></div>
<script>
const defaultCats=[
 ['Rörelsedetektorer','◉'],['Magnetkontakter','▣'],['Rökdetektorer','◌'],['Sirener','◈'],['Centralapparater','▤'],['Expansionskort','▦'],['Batterier','▰'],['Motstånd','≈'],['Kabel','⌁'],['Övrigt','＋']
];
let cats=[];
try { cats=JSON.parse(localStorage.getItem('bilLagerCategories')||'null'); } catch(e) { cats=null; }
if(!Array.isArray(cats)||!cats.length){cats=defaultCats.map(x=>[x[0],x[1]]);localStorage.setItem('bilLagerCategories',JSON.stringify(cats));}

let products=null;
try { products=JSON.parse(localStorage.getItem('bilLagerProducts')||'null'); } catch(e) { products=null; }
if(!products){products=[{id:'mc440',name:'MC440',cat:'Magnetkontakter',qty:8},{id:'mc420',name:'MC420',cat:'Magnetkontakter',qty:5},{id:'mc740',name:'MC740',cat:'Magnetkontakter',qty:0},{id:'bpr2',name:'Bosch ISC-BPR2',cat:'Rörelsedetektorer',qty:6},{id:'bpr4',name:'Bosch ISC-BPR4',cat:'Rörelsedetektorer',qty:0},{id:'ev425',name:'Aritech EV425',cat:'Rörelsedetektorer',qty:4},{id:'battery7ah',name:'12 V 7 Ah',cat:'Batterier',qty:3},{id:'res47',name:'4,7 kΩ',cat:'Motstånd',qty:36}];save();}
let activeCat=null,editId=null;
function saveCats(){try{localStorage.setItem('bilLagerCategories',JSON.stringify(cats));return true;}catch(e){alert('Kunde inte spara kategorierna.');return false;}}
function openCategories(){renderCatManager();document.getElementById('catModal').style.display='flex';}
function closeCatModal(){document.getElementById('catModal').style.display='none';}
function renderCatManager(){document.getElementById('catManageList').innerHTML=cats.map((c,i)=>`<div class="catManage"><span style="font-size:22px">${esc(c[1])}</span><input id="cat-${i}" value="${esc(c[0])}" onkeydown="if(event.key==='Enter')renameCategory(${i})"><button class="mini" onclick="renameCategory(${i})">✓</button><button class="mini danger" onclick="removeCategory(${i})">×</button></div>`).join('');}
function renameCategory(i){let input=document.getElementById('cat-'+i),name=input?.value.trim();if(!name||name===cats[i][0])return;if(cats.some((c,j)=>j!==i&&c[0].toLowerCase()===name.toLowerCase())){alert('Den kategorin finns redan.');return;}let old=cats[i][0];cats[i][0]=name;products.forEach(p=>{if(p.cat===old)p.cat=name;});saveCats();save();renderCatManager();renderCats();if(activeCat===old){activeCat=name;showCategory(name);}}
function addCategory(){let name=prompt('Namn på ny kategori:');if(!name)return;name=name.trim();if(!name)return;if(cats.some(c=>c[0].toLowerCase()===name.toLowerCase())){alert('Den kategorin finns redan.');return;}cats.push([name,'＋']);saveCats();renderCatManager();renderCats();}
function removeCategory(i){let name=cats[i][0],count=products.filter(p=>p.cat===name).length;if(count){if(!confirm(`Kategorin innehåller ${count} produkt(er). Produkterna flyttas till Övrigt.`))return;let other=cats.find(c=>c[0]==='Övrigt');if(!other){cats.push(['Övrigt','＋']);other=cats[cats.length-1];}products.forEach(p=>{if(p.cat===name)p.cat=other[0];});}if(cats.length<=1){alert('Du måste ha minst en kategori.');return;}cats.splice(i,1);saveCats();save();if(activeCat===name)showHome();renderCatManager();renderCats();}
function save(){
  try { localStorage.setItem('bilLagerProducts',JSON.stringify(products)); updateSummary(); return true; }
  catch(e){ alert('Kunde inte spara lagret på den här enheten. Kontrollera att Safari får använda webbplatsdata.'); return false; }
}
function updateSummary(){document.getElementById('summary').textContent=products.length+' produkter · '+products.reduce((a,p)=>a+Number(p.qty||0),0)+' st totalt';}
function renderCats(){document.getElementById('categories').innerHTML=cats.map(([name,icon])=>{let ps=products.filter(p=>p.cat===name),q=ps.reduce((a,p)=>a+Number(p.qty||0),0);return `<button class="cat" onclick="showCategory('${esc(name)}')"><div class="emoji">${icon}</div><div class="catname">${name}</div><div class="count">${ps.length} produkter · ${q} st</div></button>`}).join('');}
function showHome(){activeCat=null;document.getElementById('home').style.display='block';document.getElementById('category').style.display='none';document.getElementById('results').style.display='none';document.getElementById('search').value='';renderCats();}
function showCategory(name){activeCat=name;document.getElementById('home').style.display='none';document.getElementById('results').style.display='none';document.getElementById('category').style.display='block';document.getElementById('catTitle').textContent=name;document.getElementById('catIcon').textContent=cats.find(c=>c[0]===name)?.[1]||'•';renderProducts();}
function renderProducts(){let arr=products.filter(p=>p.cat===activeCat);document.getElementById('productList').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">Inga produkter ännu.<br>Tryck på ”Lägg till produkt” för att lägga till en.</div>';}
function card(p){return `<div class="product"><div class="pinfo"><div class="pname">${esc(p.name)}</div><div class="qty">${p.qty} st</div></div><div class="controls"><button class="round" onclick="changeQty('${p.id}',-1)">−</button><div class="num">${p.qty}</div><button class="round" onclick="changeQty('${p.id}',1)">＋</button><button class="round" style="font-size:17px;margin-left:2px" onclick="openProduct('${p.id}')">⋯</button></div></div>`}
function changeQty(id,d){let p=products.find(x=>x.id===id);if(!p)return;p.qty=Math.max(0,Number(p.qty)+d);save();renderCats();activeCat?renderProducts():searchProducts();}
function searchProducts(){let q=document.getElementById('search').value.trim().toLowerCase();if(!q){if(activeCat)showCategory(activeCat);else showHome();return}document.getElementById('home').style.display='none';document.getElementById('category').style.display='none';document.getElementById('results').style.display='block';let arr=products.filter(p=>(p.name+' '+p.cat).toLowerCase().includes(q));document.getElementById('resultList').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">Ingen produkt hittades.</div>';}
function openProduct(id){editId=id||null;document.getElementById('modalTitle').textContent=id?'Redigera produkt':'Ny produkt';document.getElementById('pcat').innerHTML=cats.map(c=>`<option>${c[0]}</option>`).join('');let p=id&&products.find(x=>x.id===id);document.getElementById('pname').value=p?.name||'';document.getElementById('pqty').value=p?.qty??1;if(p)document.getElementById('pcat').value=p.cat;document.getElementById('deleteWrap').innerHTML=p?'<div class="modalBtns"><button class="danger" onclick="deleteProduct()">Ta bort produkt</button></div>':'';document.getElementById('modal').style.display='flex';setTimeout(()=>document.getElementById('pname').focus(),100)}
function closeModal(){document.getElementById('modal').style.display='none';editId=null}
function saveProduct(){let name=document.getElementById('pname').value.trim(),cat=document.getElementById('pcat').value,qty=Math.max(0,Number(document.getElementById('pqty').value)||0);if(!name)return;if(editId){let p=products.find(x=>x.id===editId);Object.assign(p,{name,cat,qty});}else products.push({id:(Date.now().toString(36)+Math.random().toString(36).slice(2)),name,cat,qty});
if(save()){ closeModal(); renderCats(); if(activeCat)renderProducts(); else showHome(); }}
function deleteProduct(){if(!editId)return;products=products.filter(p=>p.id!==editId);save();closeModal();renderCats();if(activeCat)renderProducts();else showHome();}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
renderCats();updateSummary();
</script><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
</body></html>
